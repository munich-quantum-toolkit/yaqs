version: 2

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

build:
  os: ubuntu-26.04
  tools:
    python: "3.14"
  jobs:
    install:
      - uv pip install --python "$READTHEDOCS_VIRTUALENV_PATH/bin/python" --group docs --exact -e .
    build:
      html:
        # Publish saved snapshots; GitHub Actions checks execution against current package code.
        - >-
          "$READTHEDOCS_VIRTUALENV_PATH/bin/python" -u -m sphinx
          -j 1 -n -T -W --keep-going -b html -d docs/_build/doctrees
          -D yaqs_require_current_runtime=0
          docs "$READTHEDOCS_OUTPUT/html"

python:
  install:
    - method: uv
      command: pip
      path: .
