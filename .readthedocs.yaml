version: 2

sphinx:
  configuration: docs/conf.py

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    install:
      - uv pip install --python "$READTHEDOCS_VIRTUALENV_PATH/bin/python" --group docs --torch-backend cpu --exact -e '.[qasm3,torch]'

python:
  install:
    - method: uv
      command: pip
      path: .
      extras:
        - qasm3
        - torch
